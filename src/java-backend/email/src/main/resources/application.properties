spring.application.name=email
server.port=8090

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=fasteventmanager.fem@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=fasteventmanager.fem@gmail.com

spring.kafka.bootstrap-servers=${KAFKA_ADDRESS}
email.topic=email.send

spring.kafka.consumer.group-id=email-service
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.consumer.properties.heartbeat.interval.ms=15000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true

spring.kafka.properties.retry.backoff.ms=1000
spring.kafka.properties.reconnect.backoff.max.ms=10000
spring.kafka.properties.reconnect.backoff.ms=500

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer