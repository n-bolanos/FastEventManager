services:
  mysql_att:
    image: mysql:8.0
    container_name: att_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: YOUR_ROOT_PWD
      MYSQL_DATABASE: attendance_db
      MYSQL_USER: APP_USERNAME
      MYSQL_PASSWORD: USER_PWD
    ports:
      - "3308:3306"
    volumes:
      - mysql_data_att:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pYOUR_ROOT_PWD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data_att: