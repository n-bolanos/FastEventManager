services:
  
  frontend:

    build:
      context: ../web-frontend/FEM_FRONT/
      dockerfile: Dockerfile

    image: fem-frontend:1.0

    ports:
      - "8050:8050"

    depends_on:
      - gateway

    networks:
      - frontend

  gateway:

    build:
      context: ../python-backend/api_gateway/
      dockerfile: Dockerfile

    image: api-gateway:1.0

    environment:
      ATTENDANCE_SVC_URL: http://attendance:8000
      EVENT_SVC_URL: http://event_manager:8020
      LOGIN_SVC_URL: http://login:8070
      EMAIL_SVC_URL: http://kafka:8090
      FRONT_URL: http://frontend:8050
      REFRESH_TOKEN_COOKIE_NAME: "refreshToken"

    ports:
      - "8010:8010"

    networks:
      - backend
      - frontend

  attendance:

    build:
      context: ../python-backend/attendance/
      dockerfile: Dockerfile

    image: attendance:1.0

    environment:
      KAFKA_ADDRESS: "kafka:9092"

    ports:
      - "8000:8000"

    depends_on:
      - kafka

    networks:
      - mail
      - backend

  event_manager:

    build:
      context: ../python-backend/event_manager/
      dockerfile: Dockerfile

    image: event_manager:1.0

    ports:
      - "8020:8020"
    
    networks:
      - backend

  kafka:

    image: apache/kafka:3.7.0

    container_name: fem_kafka
    environment:
      KAFKA_NODE_ID: 1
      # KRaft roles (controller and broker in same node)
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Cluster ID (random)
      CLUSTER_ID: "Yd9gN3xQTluasDF8gr12ww"
      # Listeners
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      # Mapping
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Voter (id)
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Log dirs
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    ports:
      - "9092:9092"   # external access
      - "9093:9093"   # controller port

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - mail
      
  mysql:
    image: mysql:8.0
    container_name: auth_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - auth

  login:

    build:
      context: ../java-backend/authentication/
      dockerfile: Dockerfile

    image: login-service:1.0

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/authdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AUTH_PASSWORD: mysupersecretkey123
    ports:
      - "8070:8070"

    depends_on:
      - mysql
      - kafka

    networks:
      - auth
      - backend

  email:

    build:
      context: ../java-backend/email/
      dockerfile: Dockerfile

    image: email-service:1.0

    environment:
      KAFKA_ADDRESS: "kafka:9092"
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    ports:
      - "8090:8090"

    depends_on:
      - kafka

    networks:
      - mail

volumes:
  kafka_data:
  mysql_data:

networks:
  mail:
  backend:
  auth:
  frontend:
